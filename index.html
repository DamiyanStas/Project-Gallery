<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1 class="title">PROJECT GALLERY</h1>
    <div class="container">
        <div class="gallery">
            <a href="/images/image_1.jpg" class="card-gallery">
                <img src="/images/image_1.jpg" alt="image">
            </a>
            <a href="/images/image_2.jpg" class="card-gallery">
                <img src="/images/image_2.jpg" alt="image">
            </a>
            <a href="/images/image_3.jpg" class="card-gallery">
                <img src="/images/image_3.jpg" alt="image">
            </a>
            <a href="/images/image_4.jpg" class="card-gallery">
                <img src="/images/image_4.jpg" alt="image">
            </a>
            <a href="/images/image_5.jpg" class="card-gallery">
                <img src="/images/image_5.jpg" alt="image">
            </a>
            <a href="/images/image_6.jpg" class="card-gallery">
                <img src="/images/image_6.jpg" alt="image">
            </a>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="modal" class="modal">
        <span class="close-btn">&times;</span>
        <button class="prev-btn">&#10094;</button>
        <img id="modal-img" src="" alt="">
        <button class="next-btn">&#10095;</button>
    </div>

    <script src="./script.js"></script>

</body>

</html>
